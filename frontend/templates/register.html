<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - NextAct</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
    <div class="register-container">
        <h1>Đăng Ký</h1>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="registerForm">
            <div class="form-group">
                <input 
                    type="text" 
                    id="full_name" 
                    name="full_name" 
                    placeholder="Họ và Tên" 
                    required
                >
            </div>

            <div class="form-group">
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Email" 
                    required
                >
            </div>

            <div class="form-group password-group">
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Mật Khẩu" 
                    required
                    minlength="6"
                >
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', 'eyeIcon')">
                    <svg id="eyeIcon" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <div class="form-group password-group">
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    placeholder="Xác Nhận Mật Khẩu" 
                    required
                >
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm_password', 'eyeIconConfirm')">
                    <svg id="eyeIconConfirm" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button type="submit" class="register-btn">Đăng Ký</button>
        </form>

        <div class="login-link">
            Đã có tài khoản? <a href="/login">Đăng Nhập</a>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
